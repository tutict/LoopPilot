name: Validate

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      LOOPPILOT_TEST_REQUIRE_SHELLS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run Phase 4 checkpoint recovery regressions
        run: python -m unittest tests.test_full_loop_checkpoint_recovery -v
      - name: Run Phase 5 Project closure regressions
        run: python -m unittest tests.test_project_closure_final_delivery -v
      - name: Run Phase 7 evaluation calibration regressions
        run: python -m unittest tests.test_evaluation_calibration -v
      - name: Run public validator and YAML rejection checks
        run: |
          python scripts/validate.py
          python -m unittest tests.test_validation_failures -v
      - name: Verify native installation lifecycle on Ubuntu
        run: python scripts/verify_installation.py --powershell "$(command -v pwsh)" --powershell-major 7 --bash "$(command -v bash)" --smoke-only --output .tmp/installation-ubuntu
      - run: python scripts/validate.py --extract-mermaid .tmp/mermaid
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Render Mermaid diagrams
        run: |
          python -c 'import json, shutil; browser = shutil.which("google-chrome"); assert browser, "runner Google Chrome is required"; print(json.dumps({"executablePath": browser}))' > .tmp/mermaid/puppeteer.json
          for diagram in .tmp/mermaid/*.mmd; do
            output="${diagram%.mmd}.svg"
            npx --yes --package @mermaid-js/mermaid-cli@11.16.0 mmdc -p .tmp/mermaid/puppeteer.json -i "$diagram" -o "$output"
            test -s "$output"
          done
          source_count=$(find .tmp/mermaid -name '*.mmd' -type f | wc -l)
          output_count=$(find .tmp/mermaid -name '*.svg' -type f | wc -l)
          test "$source_count" -gt 0
          test "$source_count" -eq "$output_count"
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installation-ubuntu
          path: .tmp/installation-ubuntu/
          if-no-files-found: error

  installation:
    name: Installation (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-powershell-5
            powershell-major: 5
          - os: windows-latest
            label: windows-powershell-7
            powershell-major: 7
          - os: macos-15
            label: macos-system-bash
            powershell-major: 7
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Run installation regressions and official entry points
        run: |
          $ps = (Get-Command pwsh -ErrorAction Stop).Source
          if ('${{ matrix.powershell-major }}' -eq '5') {
            $ps = Join-Path $env:SystemRoot 'System32/WindowsPowerShell/v1.0/powershell.exe'
          }
          if ($IsWindows) {
            $gitRoot = Split-Path (Split-Path (Get-Command git.exe -ErrorAction Stop).Source)
            $bash = Join-Path $gitRoot 'bin/bash.exe'
            python scripts/verify_installation.py --powershell $ps --powershell-major ${{ matrix.powershell-major }} --bash $bash --output '.tmp/installation-${{ matrix.label }}'
          } else {
            python scripts/verify_installation.py --powershell $ps --powershell-major 7 --bash /bin/bash --bash-major 3 --output '.tmp/installation-${{ matrix.label }}'
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installation-${{ matrix.label }}
          path: .tmp/installation-${{ matrix.label }}/
          if-no-files-found: error
